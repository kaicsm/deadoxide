[package]
name = "zomboid-engine"
version = "0.1.0"
edition = "2021"
description = "Direct Rust port of the game's own Java classes; module paths mirror the zombie.* packages."
# pz-dump-worldgen.rs is a module of pz-dump, not a standalone binary.
autobins = false

[[bin]]
name = "pz-dump"
path = "src/bin/pz-dump.rs"
[dependencies]
# zombie.util.PZXmlUtil: the XML files of the game (clothing.xml...) into a DOM.
roxmltree = "0.21"

# zombie.vehicles.VehiclesDB2.SQLStore and the other SQLite stores of a save; not in the browser build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
# zombie.erosion.ErosionData.Square.rands: the 8100-entry table is read from the player's own jar at run time.
zip = { version = "2.6.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
sha2 = "0.10"
